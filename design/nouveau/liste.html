<!DOCTYPE html>
<html lang="fr"><head>
<!-- Maquette Dropspot (export Claude Design), décompressée pour lecture par Cursor. Les {{...}} sont remplis par le script text/x-dc en bas de fichier. -->
<meta charset="utf-8">
<title>Dropspot — Liste</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.board{font-family:'Figtree',system-ui,sans-serif;color:#231915}
.th-light{--bg:#FAF7F2;--surface:#FFFFFF;--surface2:#F1ECE4;--line:#E3DACE;--text:#231915;--text2:#685A4E;--accent:#A34B1A;--onaccent:#FFFFFF;--accentsoft:#F6E5D7;--accenttext:#86390F;--ok:#2B6A47;--warn:#8A4B00;--map:#ECE5DA;--road:#FFFFFF;--park:#D9E3CB;--sea:#C9DCE4;--pin:#2A1D16;--onpin:#FFFFFF;--ph1:#DCC6AF;--ph2:#CBBBA2;--ph3:#E3D2BE;--shadow:0 6px 24px rgba(58,34,18,.14)}
.th-dark{--bg:#14100D;--surface:#211914;--surface2:#2C231D;--line:#3B3029;--text:#F4EDE6;--text2:#BBAD9F;--accent:#E3905A;--onaccent:#1B0F08;--accentsoft:#3D2719;--accenttext:#F3B086;--ok:#7CC79C;--warn:#F0B467;--map:#1C1713;--road:#2E2620;--park:#1F281C;--sea:#13202A;--pin:#F4EDE6;--onpin:#1B120D;--ph1:#3A2C22;--ph2:#33291F;--ph3:#42332A;--shadow:0 6px 24px rgba(0,0,0,.45)}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 0 0 1px rgba(40,25,15,.10),0 24px 60px rgba(40,25,15,.16);font-family:'Figtree',system-ui,sans-serif}
.ios{border-radius:46px}.android{border-radius:32px}
.disp{font-family:'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.01em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-s{width:16px;height:16px}.fill{fill:currentColor}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--text)}input::placeholder{color:var(--text2)}
.safe{height:54px;flex:none}.android .safe{height:34px}
.bigtitle{margin:0;font-size:34px;font-weight:800;line-height:1.1}.android .bigtitle{font-size:26px;font-weight:700}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);color:var(--text2);box-sizing:border-box;flex:1;min-width:0}
.ios .search{height:48px;border-radius:14px}.android .search{height:56px;border-radius:28px;padding:0 18px}
.ibtn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:none;background:var(--surface);color:var(--text);flex:none}
.ios .ibtn{border-radius:14px}.android .ibtn{width:56px;height:56px;border-radius:28px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);font-size:14px;font-weight:600;flex:none;white-space:nowrap;box-sizing:border-box}
.ios .chip{border-radius:18px}.android .chip{border-radius:10px}
.chip-on{background:var(--accentsoft);color:var(--accenttext);border-color:transparent}
.chip-off{background:var(--surface);color:var(--text)}
.feat{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:8px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;box-sizing:border-box;z-index:5}
.ios .nav{height:84px;padding:4px 6px 34px;background:var(--surface);border-top:1px solid var(--line)}
.android .nav{height:100px;padding:12px 8px 24px;background:var(--surface2)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;text-decoration:none;font-size:12px;font-weight:600}
.tab-on{color:var(--accent)}.tab-off{color:var(--text2)}.android .tab-on{color:var(--text)}
.pill{display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px}
.ios .pill{height:28px}
.android .tab-on .pill{background:var(--accentsoft);color:var(--accenttext)}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);z-index:6}
.android .home{width:108px;height:4px;opacity:.5}
.row{display:flex;gap:12px;padding:12px;border-radius:20px;background:var(--surface);color:var(--text);text-decoration:none}
.android .row{border-radius:16px}
.ph1{background:var(--ph1)}.ph2{background:var(--ph2)}.ph3{background:var(--ph3)}
.st-open{color:var(--ok)}.st-soon{color:var(--warn)}
.vlabel{font-size:15px;font-weight:600;color:#5A4E45}
</style>
</helmet>
<div class="board" style="width: 1856px; height: 1080px; box-sizing: border-box; padding: 56px 64px; background: #ECE8E2; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: baseline; gap: 18px">
<h1 class="disp" style="margin: 0; font-size: 44px; font-weight: 800; color: #231915">2 · Liste</h1>
<p style="margin: 0; font-size: 18px; color: #5A4E45">Les mêmes cafés, triés par distance ou par critère.</p>
</div>
<div style="display: flex; gap: 56px">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="vlabel">{{p.label}}</div>
<div class="{{p.cls}}">
<div style="display: flex; flex-direction: column">
<div class="safe"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 14px">
<h2 class="bigtitle disp">À proximité</h2>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px; font-size: 15px; font-weight: 700; color: var(--accent); text-decoration: none"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{ic.map}}"></path></svg>Carte</a>
</div>
<div style="display: flex; gap: 10px; padding: 0 16px">
<label class="search" style="border: 1px solid var(--line)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.search}}"></path></svg><input type="search" aria-label="Rechercher un café" placeholder="Rechercher un café…" style="border: none; background: transparent; outline: none; font-size: 16px; flex: 1; min-width: 0"></label>
</div>
<div style="display: flex; gap: 8px; padding: 14px 16px 0; overflow: hidden">
<button class="chip chip-on"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.check}}"></path></svg>Ouvert maintenant</button>
<button class="chip chip-on"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.wifi}}"></path></svg>Wi-Fi</button>
<button class="chip chip-off"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.leaf}}"></path></svg>Matcha</button>
<button class="chip chip-off"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.moon}}"></path></svg>Calme</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 8px">
<span style="font-size: 14px; color: var(--text2)">5 cafés à moins de 1 km</span>
<button style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0; border: none; background: transparent; font-size: 15px; font-weight: 700; color: var(--text)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{ic.sort}}"></path></svg>Distance<svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="{{ic.chevD}}"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
<sc-for list="{{cafes}}" as="c" hint-placeholder-count="5">
<a href="Fiche.dc.html" class="row">
<div class="{{c.ph}}" aria-hidden="true" style="width: 84px; height: 84px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text2)"><svg class="ic" sc-camel-view-box="0 0 24 24" style="width: 26px; height: 26px"><path d="{{ic.coffee}}"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span class="disp" style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span><span style="display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 700; flex: none"><svg class="ic fill" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: var(--accent)"><path d="{{ic.star}}"></path></svg>{{c.note}}</span></div>
<div style="font-size: 14px; color: var(--text2)"><span class="{{c.stCls}}" style="font-weight: 700">{{c.status}}</span> · {{c.dist}} · {{c.hours}}</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{c.feats}}" as="f" hint-placeholder-count="2">
<span class="feat"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="{{f.d}}"></path></svg>{{f.label}}</span>
</sc-for>
</div>
</div>
</a>
</sc-for>
</div>
</div>
<nav class="nav" aria-label="Navigation principale">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a class="tab {{t.cls}}" href="{{t.href}}"><span class="pill"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>{{t.label}}</a>
</sc-for>
</nav>
<div class="home" aria-hidden="true"></div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1856,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const ic = {
      search: 'M21 21l-4.3-4.3M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0z',
      wifi: 'M2.5 8.8a14 14 0 0 1 19 0M5.5 12.2a9.5 9.5 0 0 1 13 0M8.6 15.5a5 5 0 0 1 6.8 0M12 19.2h.01',
      leaf: 'M5 20c0-8.5 5.5-15 15-15 0 9.5-6.5 15-15 15zM5 20l8-8',
      moon: 'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z',
      cal: 'M8 3v3M16 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
      check: 'M20 6L9 17l-5-5',
      sort: 'M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4',
      chevD: 'M6 9l6 6 6-6',
      map: 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      list: 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01',
      zap: 'M13 2L4 14h7l-1 8 9-12h-7l1-8z',
      user: 'M20 21a8 8 0 0 0-16 0M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z',
      star: 'M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.5 9.4l6.6-1L12 2.5z',
      coffee: 'M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zM7 2v3M11 2v3M15 2v3'
    };
    const F = {
      wifi: { d: ic.wifi, label: 'Wi-Fi' },
      matcha: { d: ic.leaf, label: 'Matcha' },
      calme: { d: ic.moon, label: 'Calme' },
      act: { d: ic.cal, label: 'Activités' }
    };
    const phones = [
      { label: 'iPhone · Clair', cls: 'phone ios th-light' },
      { label: 'iPhone · Sombre', cls: 'phone ios th-dark' },
      { label: 'Android · Clair', cls: 'phone android th-light' },
      { label: 'Android · Sombre', cls: 'phone android th-dark' }
    ];
    const tabs = [['Carte', 'Main.dc.html', ic.map], ['Liste', 'Liste.dc.html', ic.list], ['Drops', 'Drops.dc.html', ic.zap], ['Profil', 'Profil.dc.html', ic.user]]
      .map(([label, href, d]) => ({ label, href, d, cls: label === 'Liste' ? 'tab-on' : 'tab-off' }));
    const cafes = [
      { name: 'Tech Café Sophia', note: '4,6', status: 'Ouvert', stCls: 'st-open', dist: '180 m', hours: 'ferme à 19 h', ph: 'ph1', feats: [F.wifi, F.matcha, F.calme] },
      { name: 'K-Fêt Campus', note: '4,2', status: 'Ouvert', stCls: 'st-open', dist: '240 m', hours: 'ferme à 18 h', ph: 'ph2', feats: [F.wifi, F.act] },
      { name: 'Le Comptoir Malausséna', note: '4,8', status: 'Ouvert', stCls: 'st-open', dist: '350 m', hours: 'ferme à 20 h', ph: 'ph3', feats: [F.wifi, F.calme] },
      { name: 'Oasis Coworking', note: '4,3', status: 'Ferme bientôt', stCls: 'st-soon', dist: '900 m', hours: '17 h 30', ph: 'ph1', feats: [F.wifi, F.act] },
      { name: 'Atelier Grain', note: '4,4', status: 'Ouvert', stCls: 'st-open', dist: '950 m', hours: 'ferme à 22 h', ph: 'ph2', feats: [F.wifi, F.calme] }
    ];
    return { ic, phones, tabs, cafes };
  }
}
</script>


</body></html>
