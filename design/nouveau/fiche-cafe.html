<!DOCTYPE html>
<html lang="fr"><head>
<!-- Maquette Dropspot (export Claude Design), décompressée pour lecture par Cursor. Les {{...}} sont remplis par le script text/x-dc en bas de fichier. -->
<meta charset="utf-8">
<title>Dropspot — Fiche café</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.board{font-family:'Figtree',system-ui,sans-serif;color:#231915}
.th-light{--bg:#FAF7F2;--surface:#FFFFFF;--surface2:#F1ECE4;--line:#E3DACE;--text:#231915;--text2:#685A4E;--accent:#A34B1A;--onaccent:#FFFFFF;--accentsoft:#F6E5D7;--accenttext:#86390F;--ok:#2B6A47;--ph1:#DCC6AF;--ph2:#CBBBA2;--ph3:#E3D2BE;--shadow:0 6px 24px rgba(58,34,18,.14)}
.th-dark{--bg:#14100D;--surface:#211914;--surface2:#2C231D;--line:#3B3029;--text:#F4EDE6;--text2:#BBAD9F;--accent:#E3905A;--onaccent:#1B0F08;--accentsoft:#3D2719;--accenttext:#F3B086;--ok:#7CC79C;--ph1:#3A2C22;--ph2:#33291F;--ph3:#42332A;--shadow:0 6px 24px rgba(0,0,0,.45)}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 0 0 1px rgba(40,25,15,.10),0 24px 60px rgba(40,25,15,.16);font-family:'Figtree',system-ui,sans-serif}
.ios{border-radius:46px}.android{border-radius:32px}
.disp{font-family:'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.01em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-s{width:16px;height:16px}.fill{fill:currentColor}
button{font:inherit;color:inherit;cursor:pointer}
.round{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:22px;border:none;background:var(--surface);color:var(--text);box-shadow:var(--shadow);flex:none;text-decoration:none}
.android .round{width:48px;height:48px;border-radius:24px}
.ios .hero-top{top:54px}.android .hero-top{top:34px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:none;font-size:16px;font-weight:700;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.ios .btn{border-radius:14px}.android .btn{border-radius:26px}
.btn-main{background:var(--accent);color:var(--onaccent)}
.btn-tonal{background:var(--accentsoft);color:var(--accenttext)}
.btn-out{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.gain{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px;border-radius:12px;background:rgba(255,255,255,.22);font-size:13px;font-weight:700}
.th-dark .gain{background:rgba(27,15,8,.16)}
.act{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 34px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:5}
.android .act{padding-bottom:26px;border-top:none;background:var(--surface2)}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.android .tile{border-radius:16px}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);z-index:6}
.android .home{width:108px;height:4px;opacity:.5}
.ph1{background:var(--ph1)}
.vlabel{font-size:15px;font-weight:600;color:#5A4E45}
</style>
</helmet>
<div class="board" style="width: 1856px; height: 1080px; box-sizing: border-box; padding: 56px 64px; background: #ECE8E2; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: baseline; gap: 18px">
<h1 class="disp" style="margin: 0; font-size: 44px; font-weight: 800; color: #231915">3 · Fiche café</h1>
<p style="margin: 0; font-size: 18px; color: #5A4E45">Tout ce qui compte, et un bouton pour confirmer ou corriger.</p>
</div>
<div style="display: flex; gap: 56px">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="vlabel">{{p.label}}</div>
<div class="{{p.cls}}">
<div class="ph1" aria-hidden="true" style="height: 250px; display: flex; align-items: center; justify-content: center; color: var(--text2)"><svg class="ic" sc-camel-view-box="0 0 24 24" style="width: 44px; height: 44px; stroke-width: 1.4"><path d="{{ic.coffee}}"></path></svg></div>
<div class="hero-top" style="position: absolute; left: 16px; right: 16px; display: flex; justify-content: space-between">
<a href="Main.dc.html" class="round" aria-label="Retour"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{p.back}}"></path></svg></a>
<div style="display: flex; gap: 10px">
<button class="round" aria-label="Partager"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{ic.share}}"></path></svg></button>
<button class="round" aria-label="Ajouter aux favoris"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{ic.heart}}"></path></svg></button>
</div>
</div>
<div style="position: relative; margin-top: -26px; border-radius: 26px 26px 0 0; background: var(--bg); padding: 22px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<h2 class="disp" style="margin: 0; font-size: 28px; font-weight: 800">Tech Café Sophia</h2>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 15px; color: var(--text2)"><span style="color: var(--ok); font-weight: 700">Ouvert</span> · ferme à 19 h · 180 m</span>
<a href="#itineraire" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; font-size: 15px; font-weight: 700; color: var(--accent); text-decoration: none"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{ic.nav}}"></path></svg>Itinéraire</a>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
<span class="disp" style="font-size: 34px; font-weight: 800; line-height: 1">4,6</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; gap: 2px; color: var(--accent)" role="img" aria-label="4,6 sur 5">
<svg class="ic fill" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="{{ic.star}}"></path></svg><svg class="ic fill" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="{{ic.star}}"></path></svg><svg class="ic fill" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="{{ic.star}}"></path></svg><svg class="ic fill" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="{{ic.star}}"></path></svg><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="{{ic.star}}"></path></svg>
</div>
<span style="font-size: 14px; color: var(--text2)">38 avis de la communauté · mis à jour il y a 2 h</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{feats}}" as="f" hint-placeholder-count="4">
<div class="tile">
<div style="display: flex; align-items: center; gap: 8px"><span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: var(--accentsoft); color: var(--accenttext)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{f.d}}"></path></svg></span><span style="font-size: 14px; font-weight: 600; color: var(--text2)">{{f.label}}</span></div>
<span style="font-size: 16px; font-weight: 700">{{f.value}}</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text2)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; color: var(--ok)"><path d="{{ic.check}}"></path></svg>{{f.conf}}</span>
</div>
</sc-for>
</div>
</div>
<div class="act">
<span style="font-size: 14px; color: var(--text2); text-align: center">Ces infos sont-elles toujours justes ?</span>
<div style="display: flex; gap: 10px">
<button class="btn btn-main" style="flex: 1; padding: 0 14px">Tout est juste<span class="gain">+10 Grains</span></button>
<button class="btn btn-out" style="padding: 0 18px">Corriger</button>
</div>
</div>
<div class="home" aria-hidden="true"></div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1856,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const ic = {
      wifi: 'M2.5 8.8a14 14 0 0 1 19 0M5.5 12.2a9.5 9.5 0 0 1 13 0M8.6 15.5a5 5 0 0 1 6.8 0M12 19.2h.01',
      leaf: 'M5 20c0-8.5 5.5-15 15-15 0 9.5-6.5 15-15 15zM5 20l8-8',
      moon: 'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z',
      cal: 'M8 3v3M16 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
      check: 'M20 6L9 17l-5-5',
      edit: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z',
      nav: 'M4 11l16-7-7 16-2-7-7-2z',
      share: 'M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13',
      heart: 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z',
      star: 'M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.5 9.4l6.6-1L12 2.5z',
      coffee: 'M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zM7 2v3M11 2v3M15 2v3'
    };
    const chevL = 'M15 18l-6-6 6-6';
    const arrowL = 'M19 12H5M11 18l-6-6 6-6';
    const phones = [
      { label: 'iPhone · Clair', cls: 'phone ios th-light', back: chevL },
      { label: 'iPhone · Sombre', cls: 'phone ios th-dark', back: chevL },
      { label: 'Android · Clair', cls: 'phone android th-light', back: arrowL },
      { label: 'Android · Sombre', cls: 'phone android th-dark', back: arrowL }
    ];
    const feats = [
      { d: ic.wifi, label: 'Wi-Fi', value: 'Fiable, 45 Mb/s', conf: '12 confirmations' },
      { d: ic.leaf, label: 'Matcha', value: 'Latte et nature', conf: '8 confirmations' },
      { d: ic.moon, label: 'Ambiance', value: 'Calme le matin', conf: '5 confirmations' },
      { d: ic.cal, label: 'Activités', value: 'Jeux le jeudi soir', conf: '3 confirmations' }
    ];
    return { ic, phones, feats };
  }
}
</script>


</body></html>
