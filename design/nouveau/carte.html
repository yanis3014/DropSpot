<!DOCTYPE html>
<html lang="fr"><head>
<!-- Maquette Dropspot (export Claude Design), décompressée pour lecture par Cursor. Les {{...}} sont remplis par le script text/x-dc en bas de fichier. -->
<meta charset="utf-8">
<title>Dropspot — Carte</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.board{font-family:'Figtree',system-ui,sans-serif;color:#231915}
.th-light{--bg:#FAF7F2;--surface:#FFFFFF;--surface2:#F1ECE4;--line:#E3DACE;--text:#231915;--text2:#685A4E;--accent:#A34B1A;--onaccent:#FFFFFF;--accentsoft:#F6E5D7;--accenttext:#86390F;--ok:#2B6A47;--map:#ECE5DA;--road:#FFFFFF;--park:#D9E3CB;--sea:#C9DCE4;--pin:#2A1D16;--onpin:#FFFFFF;--ph1:#DCC6AF;--ph2:#CBBBA2;--ph3:#E3D2BE;--shadow:0 6px 24px rgba(58,34,18,.14)}
.th-dark{--bg:#14100D;--surface:#211914;--surface2:#2C231D;--line:#3B3029;--text:#F4EDE6;--text2:#BBAD9F;--accent:#E3905A;--onaccent:#1B0F08;--accentsoft:#3D2719;--accenttext:#F3B086;--ok:#7CC79C;--map:#1C1713;--road:#2E2620;--park:#1F281C;--sea:#13202A;--pin:#F4EDE6;--onpin:#1B120D;--ph1:#3A2C22;--ph2:#33291F;--ph3:#42332A;--shadow:0 6px 24px rgba(0,0,0,.45)}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 0 0 1px rgba(40,25,15,.10),0 24px 60px rgba(40,25,15,.16);font-family:'Figtree',system-ui,sans-serif}
.ios{border-radius:46px}.android{border-radius:32px}
.disp{font-family:'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.01em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-s{width:16px;height:16px}.fill{fill:currentColor}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--text)}input::placeholder{color:var(--text2)}
.safe{height:54px;flex:none}.android .safe{height:34px}
.bigtitle{margin:0;font-size:34px;font-weight:800;line-height:1.1}.android .bigtitle{font-size:26px;font-weight:700}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);color:var(--text2);box-sizing:border-box;flex:1;min-width:0}
.ios .search{height:48px;border-radius:14px}.android .search{height:56px;border-radius:28px;padding:0 18px}
.ibtn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:none;background:var(--surface);color:var(--text);flex:none}
.ios .ibtn{border-radius:14px}.android .ibtn{width:56px;height:56px;border-radius:28px}
.round{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:22px;border:none;background:var(--surface);color:var(--text);box-shadow:var(--shadow);flex:none}
.android .round{width:48px;height:48px;border-radius:24px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);font-size:14px;font-weight:600;flex:none;white-space:nowrap;box-sizing:border-box}
.ios .chip{border-radius:18px}.android .chip{border-radius:10px}
.chip-on{background:var(--accentsoft);color:var(--accenttext);border-color:transparent}
.chip-off{background:var(--surface);color:var(--text)}
.feat{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:8px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:none;font-size:16px;font-weight:700;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.ios .btn{border-radius:14px}.android .btn{border-radius:26px}
.btn-main{background:var(--accent);color:var(--onaccent)}
.btn-tonal{background:var(--accentsoft);color:var(--accenttext)}
.btn-out{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.ios .near{left:50%;transform:translateX(-50%);bottom:236px;border-radius:26px}
.android .near{right:16px;bottom:248px;height:56px;border-radius:16px}
.top{position:absolute;left:16px;right:16px;z-index:3}.ios .top{top:54px}.android .top{top:34px}
.ios .peek{bottom:96px}.android .peek{bottom:112px}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;box-sizing:border-box;z-index:5}
.ios .nav{height:84px;padding:4px 6px 34px;background:var(--surface);border-top:1px solid var(--line)}
.android .nav{height:100px;padding:12px 8px 24px;background:var(--surface2)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;text-decoration:none;font-size:12px;font-weight:600}
.tab-on{color:var(--accent)}.tab-off{color:var(--text2)}.android .tab-on{color:var(--text)}
.pill{display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px}
.ios .pill{height:28px}
.android .tab-on .pill{background:var(--accentsoft);color:var(--accenttext)}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);z-index:6}
.android .home{width:108px;height:4px;opacity:.5}
.ph1{background:var(--ph1)}.ph2{background:var(--ph2)}.ph3{background:var(--ph3)}
.vlabel{font-size:15px;font-weight:600;color:#5A4E45}
</style>
</helmet>
<div class="board" style="width: 1856px; height: 1080px; box-sizing: border-box; padding: 56px 64px; background: #ECE8E2; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: baseline; gap: 18px">
<h1 class="disp" style="margin: 0; font-size: 44px; font-weight: 800; color: #231915">1 · Carte</h1>
<p style="margin: 0; font-size: 18px; color: #5A4E45">Les cafés autour de toi, en un coup d'œil. Action principale : Près de moi.</p>
</div>
<div style="display: flex; gap: 56px">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="vlabel">{{p.label}}</div>
<div class="{{p.cls}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--map); overflow: hidden">
<div style="position: absolute; left: -160px; top: 650px; width: 760px; height: 320px; background: var(--sea); transform: rotate(-10deg)"></div>
<div style="position: absolute; left: 24px; top: 196px; width: 130px; height: 96px; border-radius: 44px; background: var(--park)"></div>
<div style="position: absolute; left: 252px; top: 360px; width: 150px; height: 120px; border-radius: 56px; background: var(--park)"></div>
<div style="position: absolute; left: -60px; top: 470px; width: 560px; height: 14px; background: var(--road); transform: rotate(-18deg)"></div>
<div style="position: absolute; left: -60px; top: 300px; width: 560px; height: 8px; background: var(--road); transform: rotate(12deg)"></div>
<div style="position: absolute; left: -60px; top: 600px; width: 560px; height: 8px; background: var(--road); transform: rotate(-6deg)"></div>
<div style="position: absolute; left: 176px; top: -40px; width: 14px; height: 940px; background: var(--road); transform: rotate(9deg)"></div>
<div style="position: absolute; left: 70px; top: -40px; width: 8px; height: 940px; background: var(--road); transform: rotate(-7deg)"></div>
<div style="position: absolute; left: 318px; top: -40px; width: 8px; height: 940px; background: var(--road); transform: rotate(-14deg)"></div>
<div style="position: absolute; left: 212px; top: 196px; transform: rotate(99deg); transform-origin: left top; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); white-space: nowrap">Av. Jean Médecin</div>
<div style="position: absolute; left: 24px; top: 548px; transform: rotate(-18deg); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); white-space: nowrap">Bd Victor Hugo</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 150px; top: 404px; width: 64px; height: 64px; border-radius: 32px; background: rgba(58,120,216,.20); display: flex; align-items: center; justify-content: center">
<div style="width: 16px; height: 16px; border-radius: 11px; background: #3A78D8; border: 3px solid #FFFFFF"></div>
</div>
<sc-for list="{{pins}}" as="pin" hint-placeholder-count="6">
<button aria-label="{{pin.label}}" style="position: absolute; {{pin.pos}}; width: 44px; height: 44px; padding: 0; border-radius: 22px; border: 2px solid var(--surface); background: var(--pin); color: var(--onpin); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{pin.d}}"></path></svg></button>
</sc-for>
<button aria-label="Tech Café Sophia, sélectionné" style="position: absolute; left: 148px; top: 292px; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: 2px solid var(--surface); background: var(--accent); color: var(--onaccent); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{ic.wifi}}"></path></svg>Tech Café Sophia</button>
<div class="top" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 10px">
<label class="search" style="box-shadow: var(--shadow)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.search}}"></path></svg><input type="search" aria-label="Rechercher un café" placeholder="Rechercher un café, une rue…" style="border: none; background: transparent; outline: none; font-size: 16px; flex: 1; min-width: 0"></label>
<button class="ibtn" aria-label="Tous les filtres" style="box-shadow: var(--shadow)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.sliders}}"></path></svg></button>
</div>
<div style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
<button class="chip chip-on" style="box-shadow: var(--shadow)"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.wifi}}"></path></svg>Wi-Fi</button>
<button class="chip chip-off" style="box-shadow: var(--shadow)"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.leaf}}"></path></svg>Matcha</button>
<button class="chip chip-off" style="box-shadow: var(--shadow)"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.moon}}"></path></svg>Calme</button>
<button class="chip chip-off" style="box-shadow: var(--shadow)"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.clock}}"></path></svg>Ouvert maintenant</button>
</div>
</div>
<button class="btn btn-main near" style="position: absolute; z-index: 4; box-shadow: var(--shadow)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{ic.locate}}"></path></svg>Près de moi</button>
<a href="Fiche.dc.html" class="peek" style="position: absolute; left: 16px; right: 16px; z-index: 4; display: flex; gap: 12px; padding: 12px; border-radius: 22px; background: var(--surface); color: var(--text); text-decoration: none; box-shadow: var(--shadow)">
<div class="ph1" aria-hidden="true" style="width: 84px; height: 84px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text2)"><svg class="ic" sc-camel-view-box="0 0 24 24" style="width: 28px; height: 28px"><path d="{{ic.coffee}}"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span class="disp" style="font-size: 18px; font-weight: 700">Tech Café Sophia</span><span style="display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 700"><svg class="ic fill" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: var(--accent)"><path d="{{ic.star}}"></path></svg>4,6</span></div>
<div style="font-size: 14px; color: var(--text2)"><span style="color: var(--ok); font-weight: 700">Ouvert</span> · 180 m · ferme à 19 h</div>
<div style="display: flex; gap: 6px"><span class="feat"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="{{ic.wifi}}"></path></svg>Wi-Fi</span><span class="feat"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="{{ic.leaf}}"></path></svg>Matcha</span><span class="feat"><svg class="ic ic-s" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="{{ic.moon}}"></path></svg>Calme</span></div>
</div>
</a>
<nav class="nav" aria-label="Navigation principale">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a class="tab {{t.cls}}" href="{{t.href}}"><span class="pill"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>{{t.label}}</a>
</sc-for>
</nav>
<div class="home" aria-hidden="true"></div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1856,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const ic = {
      search: 'M21 21l-4.3-4.3M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0z',
      sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',
      wifi: 'M2.5 8.8a14 14 0 0 1 19 0M5.5 12.2a9.5 9.5 0 0 1 13 0M8.6 15.5a5 5 0 0 1 6.8 0M12 19.2h.01',
      leaf: 'M5 20c0-8.5 5.5-15 15-15 0 9.5-6.5 15-15 15zM5 20l8-8',
      moon: 'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z',
      cal: 'M8 3v3M16 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
      clock: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
      locate: 'M12 2v3M12 19v3M2 12h3M19 12h3M18.5 12a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0zM14 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0z',
      map: 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      list: 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01',
      zap: 'M13 2L4 14h7l-1 8 9-12h-7l1-8z',
      user: 'M20 21a8 8 0 0 0-16 0M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z',
      star: 'M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.5 9.4l6.6-1L12 2.5z',
      coffee: 'M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zM7 2v3M11 2v3M15 2v3'
    };
    const phones = [
      { label: 'iPhone · Clair', cls: 'phone ios th-light' },
      { label: 'iPhone · Sombre', cls: 'phone ios th-dark' },
      { label: 'Android · Clair', cls: 'phone android th-light' },
      { label: 'Android · Sombre', cls: 'phone android th-dark' }
    ];
    const tabs = [['Carte', 'Main.dc.html', ic.map], ['Liste', 'Liste.dc.html', ic.list], ['Drops', 'Drops.dc.html', ic.zap], ['Profil', 'Profil.dc.html', ic.user]]
      .map(([label, href, d]) => ({ label, href, d, cls: label === 'Carte' ? 'tab-on' : 'tab-off' }));
    const pins = [
      { pos: 'left: 52px; top: 214px', d: ic.wifi, label: 'K-Fêt Campus, Wi-Fi fiable' },
      { pos: 'left: 300px; top: 206px', d: ic.leaf, label: 'Maison Verte, matcha' },
      { pos: 'left: 92px; top: 336px', d: ic.moon, label: 'Le Comptoir Malausséna, calme' },
      { pos: 'left: 318px; top: 420px', d: ic.wifi, label: 'Oasis Coworking, Wi-Fi fiable' },
      { pos: 'left: 34px; top: 470px', d: ic.cal, label: 'Atelier Grain, activités' },
      { pos: 'left: 246px; top: 494px', d: ic.leaf, label: 'Matcha Corner, matcha' }
    ];
    return { ic, phones, tabs, pins };
  }
}
</script>


</body></html>
