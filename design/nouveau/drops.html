<!DOCTYPE html>
<html lang="fr"><head>
<!-- Maquette Dropspot (export Claude Design), décompressée pour lecture par Cursor. Les {{...}} sont remplis par le script text/x-dc en bas de fichier. -->
<meta charset="utf-8">
<title>Dropspot — Drops flash</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.board{font-family:'Figtree',system-ui,sans-serif;color:#231915}
.th-light{--bg:#FAF7F2;--surface:#FFFFFF;--surface2:#F1ECE4;--line:#E3DACE;--text:#231915;--text2:#685A4E;--accent:#A34B1A;--onaccent:#FFFFFF;--accentsoft:#F6E5D7;--accenttext:#86390F;--ok:#2B6A47;--shadow:0 6px 24px rgba(58,34,18,.14)}
.th-dark{--bg:#14100D;--surface:#211914;--surface2:#2C231D;--line:#3B3029;--text:#F4EDE6;--text2:#BBAD9F;--accent:#E3905A;--onaccent:#1B0F08;--accentsoft:#3D2719;--accenttext:#F3B086;--ok:#7CC79C;--shadow:0 6px 24px rgba(0,0,0,.45)}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 0 0 1px rgba(40,25,15,.10),0 24px 60px rgba(40,25,15,.16);font-family:'Figtree',system-ui,sans-serif}
.ios{border-radius:46px}.android{border-radius:32px}
.disp{font-family:'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.01em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fill{fill:currentColor}
button{font:inherit;color:inherit;cursor:pointer}
.safe{height:54px;flex:none}.android .safe{height:34px}
.bigtitle{margin:0;font-size:34px;font-weight:800;line-height:1.1}.android .bigtitle{font-size:26px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);font-size:14px;font-weight:600;flex:none;white-space:nowrap;box-sizing:border-box}
.ios .chip{border-radius:18px}.android .chip{border-radius:10px}
.chip-on{background:var(--accentsoft);color:var(--accenttext);border-color:transparent}
.chip-off{background:var(--surface);color:var(--text)}
.grains{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:18px;background:var(--accentsoft);color:var(--accenttext);font-size:15px;font-weight:700;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:none;font-size:16px;font-weight:700;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.ios .btn{border-radius:14px}.android .btn{border-radius:26px}
.btn-main{background:var(--accent);color:var(--onaccent)}
.btn-tonal{background:var(--accentsoft);color:var(--accenttext)}
.drop{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.android .drop{border-radius:18px}
.timer{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.t-urgent{background:var(--accent);color:var(--onaccent)}
.t-calm{background:var(--accentsoft);color:var(--accenttext)}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;box-sizing:border-box;z-index:5}
.ios .nav{height:84px;padding:4px 6px 34px;background:var(--surface);border-top:1px solid var(--line)}
.android .nav{height:100px;padding:12px 8px 24px;background:var(--surface2)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;text-decoration:none;font-size:12px;font-weight:600}
.tab-on{color:var(--accent)}.tab-off{color:var(--text2)}.android .tab-on{color:var(--text)}
.pill{display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px}
.ios .pill{height:28px}
.android .tab-on .pill{background:var(--accentsoft);color:var(--accenttext)}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);z-index:6}
.android .home{width:108px;height:4px;opacity:.5}
.vlabel{font-size:15px;font-weight:600;color:#5A4E45}
</style>
</helmet>
<div class="board" style="width: 1856px; height: 1080px; box-sizing: border-box; padding: 56px 64px; background: #ECE8E2; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: baseline; gap: 18px">
<h1 class="disp" style="margin: 0; font-size: 44px; font-weight: 800; color: #231915">4 · Drops flash</h1>
<p style="margin: 0; font-size: 18px; color: #5A4E45">Des offres qui disparaissent vite, juste à côté.</p>
</div>
<div style="display: flex; gap: 56px">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="vlabel">{{p.label}}</div>
<div class="{{p.cls}}">
<div style="display: flex; flex-direction: column">
<div class="safe"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 4px">
<h2 class="bigtitle disp">Drops flash</h2>
<a href="Profil.dc.html" class="grains" aria-label="340 Grains, voir mon profil"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{ic.bean}}"></path></svg>340</a>
</div>
<p style="margin: 0; padding: 0 20px 14px; font-size: 15px; color: var(--text2)">Offres éphémères à moins de 1 km</p>
<div style="display: flex; gap: 8px; padding: 0 16px 14px; overflow: hidden">
<button class="chip chip-on">Tous</button>
<button class="chip chip-off">Boissons</button>
<button class="chip chip-off">Matcha</button>
<button class="chip chip-off">Activités</button>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
<sc-for list="{{drops}}" as="d" hint-placeholder-count="3">
<article class="drop">
<div style="display: flex; align-items: center; justify-content: space-between">
<span class="timer {{d.tCls}}"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="{{ic.clock}}"></path></svg>{{d.time}}</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--text2)"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="{{ic.nav}}"></path></svg>{{d.dist}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h3 class="disp" style="margin: 0; font-size: 20px; font-weight: 700">{{d.title}}</h3>
<a href="Fiche.dc.html" style="font-size: 15px; color: var(--text2); text-decoration: none">{{d.cafe}} · {{d.left}}</a>
</div>
<a href="#itineraire" class="btn {{d.bCls}}" style="height: 48px">Je m'y rends<svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{ic.arrowR}}"></path></svg></a>
</article>
</sc-for>
</div>
</div>
<nav class="nav" aria-label="Navigation principale">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a class="tab {{t.cls}}" href="{{t.href}}"><span class="pill"><svg class="ic" sc-camel-view-box="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>{{t.label}}</a>
</sc-for>
</nav>
<div class="home" aria-hidden="true"></div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1856,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const ic = {
      clock: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
      nav: 'M4 11l16-7-7 16-2-7-7-2z',
      arrowR: 'M5 12h14M13 6l6 6-6 6',
      bean: 'M12 3c3.9 0 7 4 7 9s-3.1 9-7 9-7-4-7-9 3.1-9 7-9zM12 3c-2 3 2 6 0 9s2 6 0 9',
      map: 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      list: 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01',
      zap: 'M13 2L4 14h7l-1 8 9-12h-7l1-8z',
      user: 'M20 21a8 8 0 0 0-16 0M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z'
    };
    const phones = [
      { label: 'iPhone · Clair', cls: 'phone ios th-light' },
      { label: 'iPhone · Sombre', cls: 'phone ios th-dark' },
      { label: 'Android · Clair', cls: 'phone android th-light' },
      { label: 'Android · Sombre', cls: 'phone android th-dark' }
    ];
    const tabs = [['Carte', 'Main.dc.html', ic.map], ['Liste', 'Liste.dc.html', ic.list], ['Drops', 'Drops.dc.html', ic.zap], ['Profil', 'Profil.dc.html', ic.user]]
      .map(([label, href, d]) => ({ label, href, d, cls: label === 'Drops' ? 'tab-on' : 'tab-off' }));
    const drops = [
      { time: 'Encore 14:52', tCls: 't-urgent', dist: '520 m', title: '−30 % sur le matcha latte', cafe: 'Maison Verte', left: '12 restants', bCls: 'btn-main' },
      { time: 'Encore 38 min', tCls: 't-calm', dist: '350 m', title: 'Cookie offert avec un café', cafe: 'Le Comptoir Malausséna', left: '20 restants', bCls: 'btn-tonal' },
      { time: 'Encore 1 h 12', tCls: 't-calm', dist: '240 m', title: 'Atelier latte art', cafe: 'K-Fêt Campus', left: '4 places', bCls: 'btn-tonal' }
    ];
    return { ic, phones, tabs, drops };
  }
}
</script>


</body></html>
